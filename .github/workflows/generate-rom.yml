name: Generate OoTMM ROM

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Install MIPS toolchain
        run: |
          wget https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-amd64.deb
          sudo apt-get update
          sudo dpkg -i gcc-toolchain-mips64-amd64.deb || sudo apt-get install -f -y
          rm gcc-toolchain-mips64-amd64.deb
          echo "/opt/libdragon/bin" >> "$GITHUB_PATH"

      - name: Create pnpm-workspace.yaml
        run: |
          cat > pnpm-workspace.yaml << 'EOF'
          packages:
            - 'packages/*'
          onlyBuiltDependencies:
            - esbuild
            - microtime
            - nx
          EOF

      - name: Verify pnpm
        run: |
          pnpm --version
          which pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Install dependencies
        run: pnpm install

      - name: Build tools and data
        run: |
          pnpm nx run @ootmm/tools:build
          pnpm nx run @ootmm/data:build

      - name: Create string.h, strings.h and stdlib.h stubs in ultralib
        run: |
          mkdir -p packages/core/third_party/ultralib/include
          # string.h
          cat > packages/core/third_party/ultralib/include/string.h << 'EOF'
          #ifndef _STRING_H_
          #define _STRING_H_

          #include <stddef.h>

          void *memset(void *s, int c, size_t n);
          void *memcpy(void *dest, const void *src, size_t n);
          void *memmove(void *dest, const void *src, size_t n);
          int memcmp(const void *s1, const void *s2, size_t n);
          size_t strlen(const char *s);
          char *strcpy(char *dest, const char *src);
          char *strncpy(char *dest, const char *src, size_t n);
          char *strcat(char *dest, const char *src);
          char *strncat(char *dest, const char *src, size_t n);
          int strcmp(const char *s1, const char *s2);
          int strncmp(const char *s1, const char *s2, size_t n);
          char *strchr(const char *s, int c);
          char *strrchr(const char *s, int c);
          char *strstr(const char *haystack, const char *needle);
          size_t strspn(const char *s, const char *accept);
          size_t strcspn(const char *s, const char *reject);
          char *strpbrk(const char *s, const char *accept);
          char *strtok(char *str, const char *delim);

          #endif /* _STRING_H_ */
          EOF

          # strings.h
          cat > packages/core/third_party/ultralib/include/strings.h << 'EOF'
          #ifndef _STRINGS_H_
          #define _STRINGS_H_

          #include <stddef.h>

          void bzero(void *s, size_t n);
          void bcopy(const void *src, void *dest, size_t n);
          int bcmp(const void *s1, const void *s2, size_t n);

          #endif /* _STRINGS_H_ */
          EOF

          # stdlib.h
          cat > packages/core/third_party/ultralib/include/stdlib.h << 'EOF'
          #ifndef _STDLIB_H_
          #define _STDLIB_H_

          #include <stddef.h>

          void *malloc(size_t size);
          void free(void *ptr);
          void *calloc(size_t nmemb, size_t size);
          void *realloc(void *ptr, size_t size);
          void exit(int status);
          int atoi(const char *nptr);
          long strtol(const char *nptr, char **endptr, int base);
          unsigned long strtoul(const char *nptr, char **endptr, int base);
          int rand(void);
          void srand(unsigned int seed);
          int abs(int j);
          long labs(long j);

          #endif /* _STDLIB_H_ */
          EOF

      - name: Clean ultralib directory
        run: |
          rm -rf packages/core/third_party/ultralib

      - name: Build core (MIPS)
        env:
          CC: /opt/libdragon/bin/mips64-elf-gcc
        run: pnpm nx run @ootmm/core:build --skip-nx-cache

      - name: Generate ROM
        env:
          CC: /opt/libdragon/bin/mips64-elf-gcc
        run: pnpm start:core

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: ootmm-rom
          path: |
            packages/core/build/bin/*.z64
            packages/core/build/*.z64
            out/*.z64