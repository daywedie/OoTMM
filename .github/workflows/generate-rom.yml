name: Generate OoTMM ROM (No Cosmetics)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Install MIPS toolchain
        run: |
          wget https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-amd64.deb
          sudo apt-get update
          sudo dpkg -i gcc-toolchain-mips64-amd64.deb || sudo apt-get install -f -y
          rm gcc-toolchain-mips64-amd64.deb
          echo "/opt/libdragon/bin" >> "$GITHUB_PATH"

      - name: Create pnpm-workspace.yaml
        run: |
          cat > pnpm-workspace.yaml << 'EOF'
          packages:
            - 'packages/*'
          onlyBuiltDependencies:
            - esbuild
            - microtime
            - nx
          EOF

      - name: Verify pnpm
        run: |
          pnpm --version
          which pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Install dependencies
        run: pnpm install

      - name: Build tools and data
        run: |
          pnpm nx run @ootmm/tools:build
          pnpm nx run @ootmm/data:build

      - name: Build core (MIPS)
        env:
          CC: /opt/libdragon/bin/mips64-elf-gcc
        run: pnpm nx run @ootmm/core:build --skip-nx-cache

      # (Opcional) Cria um settings.json para desativar cosméticos.
      # Se o CLI aceitar --settings, use: pnpm start:core --settings settings.json
      # Caso contrário, você pode editar o arquivo cli.ts para usar essas configurações.
      - name: Create settings.json (disable cosmetics)
        run: |
          cat > packages/core/settings.json << 'EOF'
          {
            "cosmetics": {
              "enabled": false,
              "models": false,
              "music": false,
              "hud": false,
              "textures": false
            }
          }
          EOF

      - name: Generate ROM (with settings if supported)
        env:
          CC: /opt/libdragon/bin/mips64-elf-gcc
        run: |
          # Tente com --settings; se falhar, execute sem argumentos.
          pnpm start:core --settings settings.json || pnpm start:core

      # Lista os arquivos gerados (útil para debug)
      - name: Listar arquivos gerados
        run: |
          echo "Conteúdo de packages/core/out:"
          find packages/core/out -maxdepth 2 -type f -print || true
          echo ""
          echo "Procurando por .z64 e .txt:"
          find packages/core/out -type f \( -name "*.z64" -o -name "*.txt" \) -print || true

      # Upload de todos os arquivos da pasta out (inclui ROM e spoiler)
      - name: Upload ROM e Spoiler
        uses: actions/upload-artifact@v4
        with:
          name: ootmm-output
          path: |
            packages/core/out/**
