name: Build Web App

on:
  push:
    branches: [ flashram-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Install dependencies
        run: pnpm install

      - name: Install MIPS toolchain
        run: |
          wget https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-amd64.deb
          sudo apt-get update
          sudo dpkg -i gcc-toolchain-mips64-amd64.deb || sudo apt-get install -f -y
          rm gcc-toolchain-mips64-amd64.deb

      - name: Install MIPS toolchain
        run: |
          # Criar diretório para o toolchain
          mkdir -p /opt/mips
          cd /opt/mips

          # Baixar toolchain mips64-elf-gcc (versão 13.2.0, Linux x64)
          wget https://github.com/xpack-dev-tools/mips-none-elf-gcc-xpack/releases/download/v13.2.0-1/xpack-mips-none-elf-gcc-13.2.0-1-linux-x64.tar.gz
          tar -xzf xpack-mips-none-elf-gcc-13.2.0-1-linux-x64.tar.gz

          # Adicionar binários ao PATH
          echo "/opt/mips/xpack-mips-none-elf-gcc-13.2.0-1/bin" >> $GITHUB_PATH


      - name: Install MIPS toolchain (n64)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

          # Baixar e instalar toolchain MIPS (n64-ultra)
          wget https://github.com/n64-tools/n64-tools.github.io/releases/download/linux/n64-tools-linux.zip -O n64-tools.zip
          unzip n64-tools.zip -d /opt/n64-tools
          echo "/opt/n64-tools/bin" >> $GITHUB_PATH

      - name: Build
        env:
          CC: mips64-elf-gcc
        run: pnpm build

      # Etapa temporária para descobrir onde estão os arquivos gerados
      - name: Listar arquivos gerados
        run: |
          echo "Conteúdo da pasta dist (se existir):"
          ls -la dist 2>/dev/null || echo "dist não existe"
          echo ""
          echo "Procurando por index.html dentro de dist:"
          find dist -maxdepth 4 -name index.html 2>/dev/null || echo "Nenhum index.html encontrado"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ootmm-webapp
          path: dist/     # ou a pasta de saída (pode ser "build", "out", etc.)