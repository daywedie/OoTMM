name: Build Web App

on:
  push:
    branches: [ flashram-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # tempo maior para compilar o toolchain

    steps:
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget texinfo bison flex python3 git curl

      - name: Install MIPS toolchain
        run: |
          wget https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-amd64.deb
          sudo apt-get update
          sudo dpkg -i gcc-toolchain-mips64-amd64.deb || sudo apt-get install -f -y
          rm gcc-toolchain-mips64-amd64.deb
          echo "/opt/libdragon/bin" >> $GITHUB_PATH

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Install dependencies
        run: pnpm install

      - name: Build tools and data
        run: |
          pnpm nx run @ootmm/tools:build
          pnpm nx run @ootmm/data:build

      - name: Build core (MIPS)
        run: pnpm nx run @ootmm/core:build

      - name: Build GUI
        run: pnpm nx run @ootmm/gui:build

      - name: Listar arquivos gerados
        run: |
          echo "Conteúdo da pasta dist (se existir):"
          ls -la dist 2>/dev/null || echo "dist não existe"
          echo ""
          echo "Procurando por index.html dentro de dist:"
          find dist -maxdepth 4 -name index.html 2>/dev/null || echo "Nenhum index.html encontrado"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ootmm-webapp
          path: dist/   # Ajuste se necessário