name: Build Web App

on:
  push:
    branches: [ flashram-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # Etapa temporária para descobrir onde estão os arquivos gerados
      - name: Listar arquivos gerados
        run: |
          echo "Conteúdo da pasta dist (se existir):"
          ls -la dist 2>/dev/null || echo "dist não existe"
          echo ""
          echo "Procurando por index.html dentro de dist:"
          find dist -maxdepth 4 -name index.html 2>/dev/null || echo "Nenhum index.html encontrado"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ootmm-webapp
          path: dist/     # ou a pasta de saída (pode ser "build", "out", etc.)