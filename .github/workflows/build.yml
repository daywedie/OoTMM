name: Build Web App

on:
  push:
    branches: [ flashram-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Install dependencies
        run: pnpm install

      - name: Install MIPS toolchain
        run: |
          wget https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-amd64.deb
          sudo apt-get update
          sudo dpkg -i gcc-toolchain-mips64-amd64.deb || sudo apt-get install -f -y
          rm gcc-toolchain-mips64-amd64.deb

      - name: Localizar compilador MIPS
        run: |
          dpkg -L gcc-toolchain-mips64 | grep -E 'bin/.*gcc$' || true
          find / -name "mips64-elf-gcc" 2>/dev/null || find / -name "mips64-unknown-elf-gcc" 2>/dev/null || echo "compilador não encontrado"

      # Após saber o caminho, adicione ao PATH
      - name: Add MIPS toolchain to PATH
        run: |
          echo "/opt/mips64-elf/bin" >> $GITHUB_PATH   # ajuste conforme localização

      - name: Build
        env:
          CC: mips64-elf-gcc   # ou mips64-unknown-elf-gcc
        run: pnpm build

      - name: Listar arquivos gerados
        run: |
          echo "Conteúdo da pasta dist (se existir):"
          ls -la dist 2>/dev/null || echo "dist não existe"
          echo ""
          find dist -maxdepth 4 -name index.html 2>/dev/null || echo "Nenhum index.html encontrado"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ootmm-webapp
          path: dist/